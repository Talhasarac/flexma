[package]
name = "flexma-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted Flexma server: accounts, workspaces, files, real-time multiplayer and an MCP endpoint for AI agents."

[[bin]]
name = "flexma"
path = "src/main.rs"

[dependencies]
flexma-doc = { path = "../flexma-doc" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
imagesize = "0.13"
png = "0.17"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
ureq = "3"
ttf-parser = "0.25"
rustybuzz = "0.20"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7.20", features = ["io"] }
